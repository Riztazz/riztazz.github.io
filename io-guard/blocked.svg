<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="io-guard blocks a shell command that writes over a file git tracks" font-family="Consolas, 'Cascadia Mono', Menlo, monospace">
<rect width="1600" height="900" fill="#0d1117"/>
<rect x="60" y="60" width="1480" height="780" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<circle cx="100" cy="100" r="9" fill="#f85149"/><circle cx="130" cy="100" r="9" fill="#d29922"/><circle cx="160" cy="100" r="9" fill="#3fb950"/>
<text x="800" y="108" fill="#8b949e" font-size="24" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif">The agent tries to edit a file with sed</text>
<line x1="60" y1="138" x2="1540" y2="138" stroke="#30363d" stroke-width="2"/>

<text x="110" y="210" fill="#8b949e" font-size="24" font-family="'Segoe UI', Helvetica, Arial, sans-serif">THE AGENT SENDS</text>
<text x="110" y="262" fill="#e6edf3" font-size="30"><tspan fill="#3fb950">$</tspan> sed -i "s/io-guard/io-guard/" README.md</text>

<text x="110" y="356" fill="#f85149" font-size="24" font-family="'Segoe UI', Helvetica, Arial, sans-serif">IO-GUARD BLOCKS IT</text>
<rect x="110" y="380" width="1380" height="250" rx="10" fill="#2d1214" stroke="#f85149" stroke-width="2"/>
<text fill="#ffa198" font-size="26">
<tspan x="140" y="430" fill="#f85149" font-weight="bold">SHELL_WRITE</tspan>
<tspan x="140" y="474">This command writes README.md, which git tracks, through sed -i,</tspan>
<tspan x="140" y="512">so the write skips io-guard's byte checks and Claude Code's checkpoints.</tspan>
<tspan x="140" y="566" fill="#e6edf3">Use io_edit to make several changes in one call, the Edit tool for one,</tspan>
<tspan x="140" y="604" fill="#e6edf3">or the Write tool to replace it whole.</tspan>
</text>

<text x="110" y="712" fill="#3fb950" font-size="24" font-family="'Segoe UI', Helvetica, Arial, sans-serif">WHAT HAPPENS NEXT</text>
<text x="110" y="762" fill="#e6edf3" font-size="28" font-family="'Segoe UI', Helvetica, Arial, sans-serif">The file is not touched. The agent reads the reason and uses the right tool.</text>
</svg>
